  function bindGanttSidebar() {
    var panel = document.getElementById('ganttPanel');
    if (!panel) return;
    closePanelMenus();

    panel.querySelectorAll('[data-gantt-toggle]').forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute('data-gantt-toggle');
        ganttSectionOpen[key] = !ganttSectionOpen[key];
        renderGanttSidebar(activeTask, activeColumnId);
      };
    });

    panel.querySelectorAll('[data-panel-action]').forEach(function (btn) {
      if (btn.getAttribute('data-panel-menu')) return;
      btn.onclick = function () {
        var action = btn.getAttribute('data-panel-action');
        if (action === 'Close') {
          showGalleryToast('Close — preview only in Stories');
          return;
        }
        showGalleryToast(action);
      };
    });

    panel.querySelectorAll('[data-panel-menu]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var kind = btn.getAttribute('data-panel-menu');
        var menus = {
          split: [
            { label: 'Split at cursor' },
            { label: 'Split by day' },
            { label: 'Split by week' }
          ],
          move: [
            { label: 'Move by day' },
            { label: 'Move by week' },
            { label: 'Move to person…' }
          ],
          reschedule: [
            { label: 'Push to next week' },
            { label: 'Pull earlier' },
            { label: 'Fit to availability' }
          ]
        };
        openPanelMenu(btn, menus[kind] || [{ label: btn.getAttribute('data-panel-action') || 'Action' }]);
      };
    });

    var lockBtn = panel.querySelector('[data-gantt-lock]');
    var startEl = panel.querySelector('[data-gantt-bound="start"]');
    var endEl = panel.querySelector('[data-gantt-bound="end"]');
    var prevGanttStart = startEl && startEl.getAttribute('data-local');
    var prevGanttEnd = endEl && endEl.getAttribute('data-local');

    function syncGanttSchedule(changedBound) {
      var startLocal = startEl && startEl.getAttribute('data-local');
      var endLocal = endEl && endEl.getAttribute('data-local');
      var durationLocked = lockBtn && lockBtn.getAttribute('aria-pressed') === 'true';
      if (durationLocked && changedBound) {
        var shifted = applyDurationLockShift(startEl, endEl, changedBound, prevGanttStart, prevGanttEnd);
        startLocal = shifted.start || startLocal;
        endLocal = shifted.end || endLocal;
      } else if (startLocal && endLocal && endLocal < startLocal && endEl) {
        endEl.setAttribute('data-local', startLocal);
        endEl.textContent = formatDatetimeLocalLabel(startLocal);
        endLocal = startLocal;
      }
      prevGanttStart = startLocal;
      prevGanttEnd = endLocal;
      if (activeTask && startLocal && endLocal) {
        applyScheduleToTask(activeTask, WEEK_ISO, startLocal, endLocal);
      }
    }

    function bindGanttDateField(el) {
      if (!el) return;
      el.setAttribute('aria-expanded', 'false');
      el.onclick = function (e) {
        e.stopPropagation();
        if (el.disabled) return;
        if (el.classList.contains('is-open')) {
          closeDtPick();
          return;
        }
        openDtPick(el, function () {
          syncGanttSchedule(el.getAttribute('data-gantt-bound'));
        });
      };
      el.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          el.click();
        } else if (e.key === 'Escape') {
          closeDtPick();
        }
      };
    }

    if (lockBtn) {
      lockBtn.onclick = function () {
        var locked = lockBtn.getAttribute('aria-pressed') === 'true';
        locked = !locked;
        lockBtn.setAttribute('aria-pressed', locked ? 'true' : 'false');
        lockBtn.classList.toggle('is-locked', locked);
        lockBtn.title = locked ? 'Unlock dates' : 'Lock start and end together';
        lockBtn.innerHTML = scheduleLockIconHtml(locked);
        /* Keep fields editable — lock only ties duration */
        showGalleryToast(locked ? 'Start and end stay the same length apart' : 'Dates unlocked');
      };
    }

    bindGanttDateField(startEl);
    bindGanttDateField(endEl);

    var phaseBtn = panel.querySelector('[data-gantt-phase]');
    var phaseClear = panel.querySelector('[data-gantt-phase-clear]');
    if (phaseBtn) {
      phaseBtn.onclick = function (e) {
        e.stopPropagation();
        phaseBtn.setAttribute('aria-expanded', 'true');
        openPanelMenu(phaseBtn, ['Preparation', 'First Review', 'Second Review'].map(function (p) {
          return {
            label: p,
            onClick: function () {
              if (activeTask) activeTask.workPhase = p;
              var value = phaseBtn.querySelector('.Panel-phaseInput-value');
              if (value) value.innerHTML = phaseBadgeHtml(p);
              phaseBtn.setAttribute('aria-expanded', 'false');
              showGalleryToast('Phase: ' + p);
            }
          };
        }));
      };
    }
    if (phaseClear && phaseBtn) {
      phaseClear.onclick = function (e) {
        e.stopPropagation();
        closePanelMenus();
        if (activeTask) activeTask.workPhase = '';
        var value = phaseBtn.querySelector('.Panel-phaseInput-value');
        if (value) value.innerHTML = '<span class="Panel-phaseInput-placeholder">No phase</span>';
        phaseBtn.setAttribute('aria-expanded', 'false');
        showGalleryToast('Phase cleared');
      };
    }

    panel.querySelectorAll('.Panel-effort > .val').forEach(function (inp) {
      inp.onchange = function () {
        showGalleryToast('Updated ' + (inp.getAttribute('aria-label') || 'effort'));
      };
    });
  }

  var flat = [];

    });

  var activeId = 'GANT';

  function renderNav() {
    var nav = document.getElementById('galleryNav');
    var html = '<h1>Sidebar stories</h1><p class="lede">Click a story on the left. Use <strong>Kanban sidebar</strong> / <strong>Gantt sidebar</strong> in the stage to compare surfaces. Preview only — menus don’t change a real board.</p>';
    GROUPS.forEach(function (g) {
      html += '<div class="Gallery-group"><h2>' + escapeHtml(g.name) + '</h2>';
      g.items.forEach(function (item) {
        html += '<button type="button" class="Gallery-item' + (item.id === activeId ? ' is-active' : '') + '" data-id="' + item.id + '">' +
          '<span class="id">' + escapeHtml(item.id) + '</span>' +
          '<span class="title">' + escapeHtml(item.title) + '</span>' +
          '<span class="blurb">' + escapeHtml(item.blurb) + '</span></button>';
      });
      html += '</div>';
    });
    nav.innerHTML = html;
    nav.querySelectorAll('.Gallery-item').forEach(function (btn) {
      btn.onclick = function () {
        activeId = btn.getAttribute('data-id');
        history.replaceState(null, '', '#' + activeId);
        if (activeId === 'GANT' && sidebarMode !== 'gantt') {
          sidebarMode = 'gantt';
          applySidebarModeChrome();
        }
        renderNav();
        showActive();
      };
    });
  }

  function showActive() {
    var item = flat.find(function (x) { return x.id === activeId; }) || flat[0];
    activeItem = item;
    activeTask = JSON.parse(JSON.stringify(item.task));
    activeColumnId = item.columnId;
    renderSidebar(activeTask, activeColumnId, {
      menuOpen: !!item.menuOpen,
      showOverflowTip: false,
      phasesOpen: item.phasesOpen
    });
    renderGanttSidebar(activeTask, activeColumnId);
  }

  function setGalleryTab(tab) {
    document.querySelectorAll('[data-gallery-tab]').forEach(function (btn) {
      var on = btn.getAttribute('data-gallery-tab') === tab;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('[data-gallery-panel]').forEach(function (panel) {
      panel.hidden = panel.getAttribute('data-gallery-panel') !== tab;
    });
  }

  document.querySelectorAll('[data-gallery-tab]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setGalleryTab(btn.getAttribute('data-gallery-tab'));
    });
  });

  document.querySelectorAll('[data-sidebar-mode]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setSidebarMode(btn.getAttribute('data-sidebar-mode'));
    });
  });

  });
